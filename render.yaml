# Render Blueprint for FinSight: full-stack deployment on render.com
# Documentation: https://render.com/docs/blueprint-spec
services:
  # 1. FinSight Flask API Service
  - type: web
    name: finsight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && flask init-db
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 8 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/finsight.db
      - key: STORAGE_ROOT
        value: /var/data/storage
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: finsight-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: finsight-redis
          property: connectionString
      - key: LLM_BACKEND
        value: auto
      - key: AUTO_APPROVE_LOW_CONFIDENCE
        value: "true"
    disk:
      name: finsight-data
      mountPath: /var/data
      sizeGB: 1

  # 2. Celery Worker (Asynchronous multi-agent execution)
  - type: worker
    name: finsight-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker -l info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:////var/data/finsight.db
      - key: STORAGE_ROOT
        value: /var/data/storage
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: finsight-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: finsight-redis
          property: connectionString
      - key: LLM_BACKEND
        value: auto
    disk:
      name: finsight-data
      mountPath: /var/data
      sizeGB: 1

  # 3. Frontend Web Application (React + Vite SPA)
  - type: web
    name: finsight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: finsight-api
          property: host

  # 4. Redis Service
  - type: redis
    name: finsight-redis
    ipAllowList: []
    plan: free
