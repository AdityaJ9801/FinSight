[pytest]
# Scope discovery to the real test suite. Without this, pytest recursively scans the whole
# repo for test_*.py -- including ad hoc/manual validation scripts dropped in scratch/
# (e.g. against a real downloaded financial statement, with hardcoded local paths and
# module-level network/DB calls), which aren't real automated tests and can hang or fail
# collection entirely for the whole suite.
testpaths = tests
