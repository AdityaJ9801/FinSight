# Whole stack on one machine: `docker compose up --build`, then open http://localhost:8080.
# backend/ and frontend/ are independent images, so each can also be deployed on its own.

# init, api and worker all run the same backend image: it's built once (by `init`, the first
# service to start) and reused, instead of three parallel builds of identical code.
x-backend: &backend
  image: finsight-backend:local
  env_file:
    - path: ./backend/.env.docker
      required: false
    - path: ./backend/.env.docker.example
      required: false
  environment:
    - DATABASE_URL=sqlite:///finsight.db
    - STORAGE_ROOT=/app/instance/storage
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/1
  volumes:
    - instance_data:/app/instance

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: creates tables/views + canonical CoA and the default tenant. Idempotent, so
  # re-running `docker compose up` (or pulling a release with new tables) is safe.
  init:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: flask init-db
    depends_on:
      redis:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  worker:
    <<: *backend
    # No --pool=solo here (that's only needed on native Windows) -- Linux containers support
    # Celery's default prefork pool, so jobs get real multi-process concurrency.
    command: celery -A app.workers.celery_app worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # React app served by nginx, which forwards /api/* to the api service over the Docker
  # network -- the browser only ever talks to http://localhost:8080.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:5000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  instance_data:
